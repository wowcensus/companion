name = "wowcensus-upload"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
routes = [{ pattern = "api.wowcensus.io", custom_domain = true }]

[vars]
MAX_ZIP_BYTES = "67108864"
MAX_LUA_BYTES = "268435456"
REGISTRATIONS_PER_IP_PER_DAY = "10"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "wowcensus-uploads"

[[d1_databases]]
binding = "DB"
database_name = "wowcensus"
database_id = "6e64e724-848b-4f88-beb0-d3ecf4988d9d"
migrations_dir = "migrations"

[[queues.producers]]
binding = "INGEST"
queue = "wowcensus-ingest"

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }
